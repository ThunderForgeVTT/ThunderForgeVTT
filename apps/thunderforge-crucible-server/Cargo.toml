[lints]
workspace = true

[package]
name = "thunderforge-crucible-server"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

# An entry point and nothing else: it reads a port and serves the router
# `thunderforge-crucible::server` builds. The routing lives in the library so
# its tests can drive it in-process.
[[bin]]
name = "thunderforge-crucible-server"
path = "src/main.rs"

[dependencies]
thunderforge-crucible = { path = "../../crates/thunderforge-crucible" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
