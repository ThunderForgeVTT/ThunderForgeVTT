<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1018" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="A ThunderForge world to try. The world you build here is kept in this browser."
    />
    <title>ThunderForge VTT demo</title>
    <script>
      (function () {
        var stored = window.localStorage.getItem("thunderforge-theme");
        var isDark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body>
    <noscript
      ><h1>You need JavaScript to run the ThunderForge demo.</h1></noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
