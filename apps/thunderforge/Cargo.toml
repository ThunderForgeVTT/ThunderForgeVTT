[lints]
workspace = true

[package]
name = "thunderforge"
version = "0.1.0"
authors = ["mbround18 <michael.bruno1337@gmail.com>"]
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true
# Two binaries now, so `cargo run -p thunderforge` needs telling which.
default-run = "thunderforge"

# The composition root, and deliberately nothing else.
#
# `crates/thunderforge-server` is the server as a library; this crate links it to the system
# packs, merges what they contribute, and runs `main`. The split exists so a
# pack can depend on the server — which a binary crate made impossible — and
# so the one place that knows a pack exists is the one place whose job is
# knowing that (spec 032 ADR-063, research § F-5).
[[bin]]
name = "thunderforge"
path = "src/main.rs"

# The merged GraphQL schema as SDL, for `scripts/check-graphql-contract.mjs`.
# Behind a feature so the builds that run the server do not link it; see the
# file's own header.
[[bin]]
name = "thunderforge-schema"
path = "src/bin/print_schema.rs"
required-features = ["schema-sdl"]

# The example maps as the demo serves them (spec 074). Behind a feature for
# the same reason; see the file's own header.
[[bin]]
name = "thunderforge-demo-maps"
path = "src/bin/demo_maps.rs"
required-features = ["demo-maps"]

[features]
default = ["seam-probe"]
# Forwarded to the library, whose `seam_probe` contributor this gates.
seam-probe = ["thunderforge-server/seam-probe"]
# Builds `thunderforge-schema`. Enables nothing in any dependency.
schema-sdl = []
# Builds `thunderforge-demo-maps`. Enables nothing in any dependency.
demo-maps = []

[dependencies]
thunderforge-server = { path = "../../crates/thunderforge-server", default-features = false }

# What `main.rs` itself touches: the router, the schema, the CLI, logging.
# Versions and features mirror `crates/thunderforge-server/Cargo.toml` exactly — the two
# compile against the same types, so a drift here is a type error there.
async-graphql = { version = "7.2.1", features = [
  "chrono",
  "dataloader",
  "log",
  "uuid",
] }
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
diesel = { version = "2.3.12", features = [
  "postgres",
  "r2d2",
  "chrono",
  "uuid",
  "serde_json",
] }
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["full"] }
tower-cookies = { version = "0.11.0", features = ["private"] }
tower-http = { version = "0.7.0", features = [
  "fs",
  "trace",
  "cors",
  "compression-br",
  "compression-gzip",
] }
tracing = "0.1.44"
tracing-bunyan-formatter = "0.3.10"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Spec 086: the SDK, the OTLP exporter and the bridges from `tracing`. No
# `rt-tokio` (R1): the batch processors run on their own threads, so start
# never waits on an exporter. Those threads have no async runtime, so the
# exporter uses the blocking reqwest client, never the async one.
opentelemetry = "0.33.0"
# `spec_unstable_metrics_views`: the anonymous view keeps only the contract's
# labels (`Stream::with_allowed_attribute_keys`).
opentelemetry_sdk = { version = "0.33.0", features = ["spec_unstable_metrics_views"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
  "metrics",
  "logs",
] }
tracing-opentelemetry = "0.34.0"
opentelemetry-appender-tracing = "0.33.0"
thunderforge-telemetry-policy = { path = "../../crates/thunderforge-telemetry-policy" }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
serde = { version = "1.0.229", features = ["derive"] }
# `thunderforge-demo-maps` writes its listing with it; the tests already did.
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
thunderforge-canvas-core = { path = "../../crates/thunderforge-canvas-core" }
# Spec 049: the `harvest` example reads real books through the generic reader.
thunderforge-pdf = { path = "../../crates/thunderforge-pdf" }
thunderforge-pg = { path = "../../crates/thunderforge-pg" }
thunderforge-pg-sockets = { path = "../../crates/thunderforge-pg-sockets" }
thunderforge-presence = { path = "../../crates/thunderforge-presence" }
thunderforge-crucible = { path = "../../crates/thunderforge-crucible" }

[dev-dependencies]
# `play_pause_surface_tests` holds the merged schema to the server's own
# play-pause tables and seeds a world through `test_support`, both behind this
# feature so a normal build never compiles them.
thunderforge-server = { path = "../../crates/thunderforge-server", default-features = false, features = [
  "test-support",
] }
chrono = "0.4.45"
futures-util = "0.3.34"
# Spec 086: in-memory exporters for the telemetry tests.
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }

# Linked for their `inventory::submit!` blocks alone — see `system_packs.rs`.
[dependencies.thunderforge-system-dnd5e]
path = "../../packs/systems/dnd5e/server"

[dependencies.thunderforge-system-genie]
path = "../../packs/systems/genie/server"

[dependencies.thunderforge-system-pathfinder2e]
path = "../../packs/systems/pathfinder2e/server"

[dependencies.thunderforge-system-cypher-system]
path = "../../packs/systems/cypher_system/server"

[dependencies.thunderforge-system-fate-core]
path = "../../packs/systems/fate_core/server"

[dependencies.thunderforge-system-blades-in-the-dark]
path = "../../packs/systems/blades_in_the_dark/server"

[dependencies.thunderforge-system-year-zero-engine]
path = "../../packs/systems/year_zero_engine/server"

[dependencies.thunderforge-system-roll-for-shoes]
path = "../../packs/systems/roll_for_shoes/server"
