<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1018" />
    <meta name="description" content="<%= pageDescription %>" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="<%= pageTitle %>" />
    <meta property="og:description" content="<%= pageDescription %>" />
    <meta property="og:image" content="/social-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= pageTitle %>" />
    <meta name="twitter:description" content="<%= pageDescription %>" />
    <meta name="twitter:image" content="/social-card.svg" />
    <link rel="icon" href="/brand-mark.svg" type="image/svg+xml" />
    <title><%= pageTitle %></title>
    <script>
      (function () {
        var stored = window.localStorage.getItem("thunderforge-theme");
        var isDark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body>
    <noscript><h1>You need JavaScript to run ThunderForge VTT.</h1></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
