# The whole app, standing on its own.
#
# `compose.yml` is the development stack: the dependencies a host-run
# `make dev` needs, on their standard ports. This file is a different thing —
# a complete instance, app included, that collides with nothing. It has its own
# project name, its own volumes, and its own database, so bringing it up does
# not touch whatever is already running on 5432, 9000, 1025 or 8025, and the
# e2e lanes (which take 30100+, 31000+, 38000+ and 5200+) keep working beside
# it.
#
# Everything is published on the 42xxx block for the same reason. One number to
# remember: http://localhost:42080.
#
#   make container        build the image from an already-built tree
#   docker compose -f compose.app.yml up -d
#   docker compose -f compose.app.yml logs -f app
#
# The instance comes up *unconfigured*, which is the point: the first-run
# wizard is what greets you, and the setup link it needs is printed in the
# app log.
name: thunderforge-app

services:
  # The one address to remember: http://localhost:42080. Everything else in
  # this file is reachable only from inside the compose network, which is the
  # other half of "no port conflicts".
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: thunderforge-web:local
    container_name: thunderforge-app-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "42080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: thunderforge-app:local
    container_name: thunderforge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/thunderforge
      THUNDERFORGE_DATA_PATH: /srv/thunderforge/data
      # What the setup link names. Without it the server prints a link to a
      # host that only exists in a developer's browser, which is wrong for
      # every containerised operator — and is exactly what the first-run e2e
      # spec pins.
      THUNDERFORGE_PUBLIC_URL: http://localhost:42080
      # The cookie key, which the server base64-decodes at boot and will
      # panic on if it is not valid base64 — so this is base64, not a
      # passphrase. It sits in a file in the repository, which means it is
      # not a secret at all; a real deployment sets its own:
      #   openssl rand -base64 64 | tr -d '\n'
      THUNDERFORGE_SECRET: dGh1bmRlcmZvcmdlIGxvY2FsIGV4cGxvcmF0aW9uIGluc3RhbmNlIG9ubHksIG5vdCBhIGRlcGxveW1lbnQgc2VjcmV0IDAxMjM0NTY3ODk=
      # Served over plain http on localhost, so cookies cannot be Secure.
      THUNDERFORGE_SECURE_COOKIES: "false"
      # Where uploads go. These are also declared settings since spec 064, and
      # the environment wins over a stored answer — which is why the wizard
      # will show them as fixed by this deployment rather than asking.
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: thunderforge-canvas-assets
      RUSTFS_ROOT_ACCESS_KEY: thunderforge-rustfs-root
      RUSTFS_ROOT_SECRET_KEY: thunderforge-rustfs-root-secret
      RUST_LOG: info
    volumes:
      # The writable half of the data directory. Mounted per subdirectory so
      # the image's `client` and `packs` stay visible beside them.
      - app_assets:/srv/thunderforge/data/assets
      - app_worlds:/srv/thunderforge/data/worlds
      - app_databases:/srv/thunderforge/data/databases
      - app_config:/srv/thunderforge/data/config
      - app_modules:/srv/thunderforge/data/modules
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:30000/api/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  postgres:
    image: postgres:18-alpine
    container_name: thunderforge-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thunderforge
    ports:
      - "42432:5432"
    volumes:
      - app_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thunderforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2
    container_name: thunderforge-app-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: thunderforge-rustfs-root
      RUSTFS_SECRET_KEY: thunderforge-rustfs-root-secret
    ports:
      - "42900:9000"
    volumes:
      - app_rustfs:/data

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: thunderforge-app-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "42025:1025"
      - "42825:8025"

volumes:
  app_db:
  app_rustfs:
  app_assets:
  app_worlds:
  app_databases:
  app_config:
  app_modules:
