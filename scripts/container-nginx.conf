# The one port an operator talks to.
#
# Three rules, in the order nginx resolves them:
#
#   /api/    the backend, websockets included — `/api/ws` is the world-event
#            subscription and dies without the upgrade headers.
#   /assets/ the bundle if the file is there, the backend if it is not. The
#            collision is real: vite emits `/assets/entry|chunks|static/*` and
#            the server mounts uploads at `/assets`, so neither can simply win.
#   /        the bundle, falling back to index.html so a deep link into the SPA
#            (a world, a scene, /setup/<code>) is routed by the client and not
#            answered with a 404 by nginx.

# nginx has no built-in `$connection_upgrade`; the websocket proxy needs it,
# and conf.d files are included inside `http`, so this is the place for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream thunderforge_app {
    server app:30000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Map imports and canvas uploads are large by nature; the backend has its
    # own MAX_UPLOAD_BYTES and should be the thing that refuses an upload, not
    # a proxy default of 1MB.
    client_max_body_size 512m;

    # The engine wasm dominates first load. The backend compresses what it
    # serves; this is the same courtesy for what nginx serves.
    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml application/json;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://thunderforge_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A subscription is idle for long stretches by design.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://thunderforge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
