[lints]
workspace = true

[package]
name = "thunderforge-system-roll-for-shoes"
version = "0.1.0"
edition = "2021"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

# Two jobs. The first is registration: an unregistered system has every write
# of its data refused, so without this crate the sheet could draw the game but
# never save it. The second arrived with spec 062 — the world's optional rules
# are per-world settings, and a setting that lives nowhere cannot vary by
# world, so the pack owns a table for them (ADR-063) and the GraphQL that
# reads and writes it. The validators still touch no database; only
# `settings/` does.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
inventory = "0.3"
tokio = { version = "1.53", features = ["full"] }
thunderforge-canvas-core = { path = "../../../../crates/thunderforge-canvas-core" }
# Bringing a character in from the one-page sheet (spec 048 US4).
thunderforge-pdf = { path = "../../../../crates/thunderforge-pdf" }
thunderforge-sheet-import = { path = "../../../../crates/thunderforge-sheet-import" }
thunderforge-system-roll-for-shoes-sheet = { path = "../sheet" }

thunderforge-server = { path = "../../../../crates/thunderforge-server" }
diesel = { version = "2.3.12", features = [
  "postgres",
  "r2d2",
  "chrono",
  "uuid",
  "serde_json",
] }
async-graphql = { version = "7.2.1", features = [
  "chrono",
  "dataloader",
  "log",
  "uuid",
] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
# The Game Master's difficulty dice, in a world that rolls for difficulty, are
# rolled server-side (`table/`). The generator is handed to the server's own
# roll path; this crate resolves no dice itself.
rand = "0.10.2"

[dev-dependencies]
# The server's shared fixtures — `insert_test_world`, `test_app_state`. Behind
# a feature so a normal build never compiles them.
thunderforge-server = { path = "../../../../crates/thunderforge-server", features = [
  "test-support",
] }

[lib]
path = "src/lib.rs"
