[lints]
workspace = true

[package]
name = "dnd5e-server"
version = "0.1.0"
edition = "2021"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1"
inventory = "0.3"
thunderforge_canvas_core = { path = "../../../../crates/thunderforge-canvas-core" }
# Spec 048: the game-agnostic PDF layer this pack reads statblocks out of.
thunderforge-pdf = { path = "../../../../crates/thunderforge-pdf" }

[lib]
name = "dnd5e_server"
path = "src/lib.rs"
