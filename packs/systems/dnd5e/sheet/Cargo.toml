[lints]
workspace = true

[package]
name = "thunderforge-system-dnd5e-sheet"
version = "0.1.0"
edition = "2024"
license.workspace = true

# Spec 048: the D&D Beyond PDF reader. The server links it natively and the
# browser loads it as wasm, so both read a sheet the same way.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
thunderforge-pdf = { path = "../../../../crates/thunderforge-pdf" }
thunderforge-sheet-import = { path = "../../../../crates/thunderforge-sheet-import" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2.127", optional = true }
