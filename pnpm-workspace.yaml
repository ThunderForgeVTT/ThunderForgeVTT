packages:
  - apps/*
  - "packages/*"
  - dist/engine
  # Spec 047/048: the PDF reader, compiled for the browser. Built like the
  # engine and for the same reason — it is Rust the web loads.
  - dist/pdf
  # Spec 074: the dice the demo's in-page backend rolls with, built likewise.
  - dist/dice
  # Spec 048: each system pack's character sheet reader, built likewise.
  - "dist/sheet-*"
  - "crates/*"
  - "packs/*"
  - "packs/systems/*/web"

allowBuilds:
  "@parcel/watcher": true
