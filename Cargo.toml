[workspace]
resolver = "3"
members = [
    "src/server", 
    "src/core", 
    "src/engine", 
    "crates/pack_system_spec",
    "crates/thunderforge-canvas-core",
    "crates/thunderforge-crucible",
    "crates/thunderforge-dice",
    "packs/systems/dnd5e/server",
    "packs/systems/dnd5e/engine",
    "packs/systems/genie/server",
    "packs/systems/genie/engine",
    "packs/systems/pathfinder2e/server",
    "packs/systems/pathfinder2e/engine",
    "packs/systems/cypher_system/server",
    "packs/systems/cypher_system/engine",
    "packs/systems/fate_core/server",
    "packs/systems/fate_core/engine",
    "packs/systems/blades_in_the_dark/server",
    "packs/systems/blades_in_the_dark/engine",
    "packs/systems/year_zero_engine/server",
    "packs/systems/year_zero_engine/engine"
]
default-members = ["src/server", "src/core"]

[workspace.package]
# Relicensed from BSD 3-Clause to AGPL-3.0-or-later (2026-08-25) — see
# docs/research/session-hosting-architecture-spike.md §9 for the full
# rationale. Sole-copyright-holder relicense, going-forward only (prior
# BSD-licensed snapshots remain under those terms for anyone who already
# has them — this does not and cannot retroactively change that).
license = "AGPL-3.0-or-later"

# Opt-in lints beyond clippy's own defaults, verified against the current
# codebase before enabling (`cargo clippy --workspace --all-targets -- -W
# clippy::<lint>` per lint, checked for zero/near-zero existing violations) —
# each member crate must add `[lints] workspace = true` to inherit these
# (see src/server/Cargo.toml etc. for the pattern). Deliberately NOT
# included: `clippy::unwrap_used`/`expect_used` (300+/171 existing hits —
# real value, but a repo-wide cleanup of that size is its own follow-up, not
# something to silently gate CI on) and `clippy::print_stderr` (107 hits,
# likely legitimate `eprintln!`-based logging — worth auditing separately
# before deciding whether it should route through `tracing` instead).
[workspace.lints.clippy]
dbg_macro = "warn"          # forgotten dbg!() left in committed code
todo = "warn"                # stub markers that shouldn't ship
unimplemented = "warn"       # ditto
print_stdout = "warn"        # a server should log via `tracing`, not println!
exit = "warn"                # std::process::exit() would kill the whole server, not just a request
large_enum_variant = "warn"  # one oversized variant silently bloats every value of the enum
mem_forget = "warn"          # near-always a bug outside FFI/leak-on-purpose cases

[profile.release]
# less code to include into binary
panic = 'abort'
# optimization over all codebase ( better optimization, slower build )
codegen-units = 1
# optimization for size ( more aggressive )
opt-level = 3
# optimization for size
# opt-level = 's'
# link time optimization using using whole-program analysis
lto = true
