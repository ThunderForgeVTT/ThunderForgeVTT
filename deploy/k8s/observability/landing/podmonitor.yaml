# Spec 086 US4: Prometheus scrapes the landing's nginx exporter sidecar
# (landing/exporter-sidecar.yaml) every 30 seconds.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: thunderforge-landing
  namespace: thunderforge-dev
  labels:
    app: thunderforge-landing
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: thunderforge-landing
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
