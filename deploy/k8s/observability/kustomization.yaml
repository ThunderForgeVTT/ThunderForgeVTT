# Spec 086 (contracts/observability-apply.md): what `make observability`
# applies with `kubectl apply -k`. Namespace-less on purpose: the dashboards
# go to `monitoring`, where Grafana's sidecar looks, and the rules sit beside
# the app in `thunderforge-dev`.
#
# The landing's exporter sidecar, which the PodMonitor scrapes, is in the
# landing Deployment itself, in fluxified overlays/applications/thunderforge.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dashboards
  - loki-rules
  - prometheus-rules.yaml
  - landing/podmonitor.yaml
