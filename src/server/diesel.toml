# For documentation on how to configure this file,
# see https://diesel.rs/guides/configuring-diesel-cli

[print_schema]
file = "src/schema.rs"
# No "Clone" here — diesel_derive_enum's `ExistingTypePath` mode (used by
# db_types.rs's CanvasImageAssetKindEnum/PolicyEffectEnum) already generates
# a Clone impl for these same marker structs. Adding "Clone" back causes
# `diesel migration run`/`print-schema` to regenerate a conflicting second
# impl (E0119) every time — this bit multiple specs before being fixed here
# (see specs/003-dd2vtt-map-fidelity T003, specs/004-token-canvas-authoring
# T003, and the matching comment previously hand-maintained in schema.rs).
custom_type_derives = ["diesel::query_builder::QueryId"]

# Tables a system pack owns, kept out of this crate's generated schema.
#
# Spec 032 FR-004 / ADR-063: a pack owns the tables it writes. These six are
# declared in `packs/systems/genie/server/src/session/schema.rs`, and without
# this filter `diesel print-schema` would helpfully add a second declaration
# of each one here — which is exactly the drift this feature spent six
# increments removing, and it would come back silently on somebody's next
# `make schema`.
#
# The migrations that create them still live in this crate's `migrations/`;
# Diesel reads one directory per invocation, and splitting that is a separate
# decision from owning the declaration.
[print_schema.filter]
except_tables = [
  "world_genie_puzzle_clock_rewards",
  "world_genie_puzzle_clocks",
  "world_genie_resource_holdings",
  "world_genie_sessions",
  "world_genie_shop_listings",
  "world_genie_trade_proposals",
]

[migrations_directory]
dir = "migrations"
