[lints]
workspace = true

[package]
name = "thunderforge"
version = "0.1.0"
authors = ["mbround18 <michael.bruno1337@gmail.com>"]
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "thunderforge"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.1", features = ["derive"] }
serde_derive = "1.0.228"
websocket = "0.27.1"
base64 = "0.22.1"
include_dir = "0.7.4"
dotenvy = "0.15.7"
argon2 = "0.5.3"
async-recursion = "1.1.1"
axum = { version = "0.8.9", features = ["multipart"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors"] }
tower-cookies = { version = "0.11.0", features = ["private"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-bunyan-formatter = "0.3.9"
futures-util = "0.3.32"
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
async-graphql = { version = "7.2.1", features = [
  "chrono",
  "dataloader",
  "log",
  "uuid",
] }
async-graphql-axum = "7.2.1"
diesel = { version = "2.3.9", features = [
  "postgres",
  "r2d2",
  "chrono",
  "uuid",
  "serde_json",
] }
chrono = { version = "0.4.44", features = ["serde"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
uuid = { version = "1.23.1", features = ["serde", "v7"] }
once_cell = "1.20.2"
# Spec 028 / ADR-052: the fingerprint, delta and conflict rules the client
# also uses. Shared rather than reimplemented so the two sides cannot drift
# on what "current" means.
thunderforge_cache_core = { path = "../../crates/thunderforge-cache-core" }
reqwest = { version = "0.13.3", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
rand = "0.10.1"
sha2 = "0.11.0"
url = "2.5.8"
thiserror = "2.0.18"
aes-gcm = "0.10.3"
totp-rs = { version = "5.7.0", features = ["otpauth"] }
data-encoding = "2.9.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
aws-sdk-s3 = "1.143.0"
aws-sdk-sts = "1.112.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Lossy WebP encoding. `image`'s WebP encoder is lossless-only, which measured
# 2-5x larger than necessary on photographic art — see `storage::transcode`.
webp = "0.3.1"
comrak = "0.39.1"
ammonia = "4.1.1"
slug = "0.1.6"
regex = "1.13.1"

[dependencies.thunderforge_core]
path = "../core"

[dependencies.thunderforge_dice]
path = "../../crates/thunderforge-dice"

[dependencies.pack_system_spec]
path = "../../crates/pack_system_spec"

[dependencies.thunderforge_crucible]
path = "../../crates/thunderforge-crucible"

[dependencies.dnd5e_server]
path = "../../packs/systems/dnd5e/server"
package = "dnd5e-server"

[dependencies.genie_server]
path = "../../packs/systems/genie/server"
package = "genie-server"

[dependencies.pathfinder2e_server]
path = "../../packs/systems/pathfinder2e/server"
package = "pathfinder2e-server"

[dependencies.cypher_server]
path = "../../packs/systems/cypher_system/server"
package = "cypher-server"

[dependencies.fate_server]
path = "../../packs/systems/fate_core/server"
package = "fate-server"

[dependencies.blades_server]
path = "../../packs/systems/blades_in_the_dark/server"
package = "blades-server"

[dependencies.yze_server]
path = "../../packs/systems/year_zero_engine/server"
package = "yze-server"
