[package]
name = "thunderforge"
version = "0.1.0"
authors = ["mbround18 <12646562+mbround18@users.noreply.github.com>"]
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license = "BSD 3-Clause License"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "thunderforge"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.1", features = ["derive"] }
serde_derive = "1.0.228"
websocket = "0.27.1"
base64 = "0.22.1"
include_dir = "0.7.4"
dotenvy = "0.15.7"
argon2 = "0.5.3"
async-recursion = "1.1.1"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors"] }
tower-cookies = { version = "0.11.0", features = ["private"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3.32"
tokio-stream = { version = "0.1.18", features = ["sync"] }
diesel = { version = "2.3.9", features = [
  "postgres",
  "r2d2",
  "chrono",
  "uuid",
  "serde_json",
] }
chrono = { version = "0.4.44", features = ["serde"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
uuid = { version = "1.23.1", features = ["serde", "v7"] }

[dependencies.thunderforge_core]
path = "../core"
