[lints]
workspace = true

[package]
name = "thunderforge"
version = "0.1.0"
authors = ["mbround18 <michael.bruno1337@gmail.com>"]
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "thunderforge"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
serde_derive = "1.0.229"
websocket = "0.27.1"
base64 = "0.23.1"
include_dir = "0.7.4"
dotenvy = "0.15.7"
argon2 = "0.6.0"
async-recursion = "1.1.1"
axum = { version = "0.8.9", features = ["multipart"] }
tower = "0.5.3"
# `compression-br`/`compression-gzip`: the engine wasm was being served
# uncompressed. It is ~24.7MB release-built and ~4.15MB after brotli, so this
# is a ~6x cut in first-load bytes for one feature flag — a bigger lever than
# anything in the bundle itself.
tower-http = { version = "0.7.0", features = [
  "fs",
  "trace",
  "cors",
  "compression-br",
  "compression-gzip",
] }
tower-cookies = { version = "0.11.0", features = ["private"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-bunyan-formatter = "0.3.10"
futures-util = "0.3.34"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
async-graphql = { version = "7.2.1", features = [
  "chrono",
  "dataloader",
  "log",
  "uuid",
] }
async-graphql-axum = "7.2.1"
diesel = { version = "2.3.12", features = [
  "postgres",
  "r2d2",
  "chrono",
  "uuid",
  "serde_json",
] }
chrono = { version = "0.4.45", features = ["serde"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
once_cell = "1.21.4"
# Spec 028 / ADR-052: the fingerprint, delta and conflict rules the client
# also uses. Shared rather than reimplemented so the two sides cannot drift
# on what "current" means.
thunderforge_authz = { path = "../../crates/thunderforge-authz" }
thunderforge_cache_core = { path = "../../crates/thunderforge-cache-core" }
thunderforge_pg = { path = "../../crates/thunderforge-pg" }
thunderforge_pg_sockets = { path = "../../crates/thunderforge-pg-sockets" }
thunderforge_presence = { path = "../../crates/thunderforge-presence" }
# The authentication rules, extracted so they can be tested (and proptested)
# without a database, a request or a provider account behind them. The
# handlers below stay here — they own `AppState`, Diesel and the cookie jar —
# and call into these crates for every decision they make. Same reasoning as
# the cache-core split, docs/CLIENT_WORLD_CACHE.md.
thunderforge_axum_auth_core = { path = "../../crates/thunderforge-axum-auth-core" }
thunderforge_axum_oauth = { path = "../../crates/thunderforge-axum-oauth" }
thunderforge_axum_oidc = { path = "../../crates/thunderforge-axum-oidc" }
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
rand = "0.10.2"
sha2 = "0.11.0"
url = "2.5.8"
thiserror = "2.0.20"
aes-gcm = "0.11.1"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
data-encoding = "2.11.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
aws-sdk-s3 = "1.144.0"
aws-sdk-sts = "1.113.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Lossy WebP encoding. `image`'s WebP encoder is lossless-only, which measured
# 2-5x larger than necessary on photographic art — see `storage::transcode`.
webp = "0.3.1"
comrak = "0.54.0"
ammonia = "4.1.4"
slug = "0.1.6"
regex = "1.13.1"

[dependencies.thunderforge_core]
path = "../core"

[dependencies.thunderforge_dice]
path = "../../crates/thunderforge-dice"

[dependencies.pack_system_spec]
path = "../../crates/pack_system_spec"

[dependencies.thunderforge_crucible]
path = "../../crates/thunderforge-crucible"

[dependencies.dnd5e_server]
path = "../../packs/systems/dnd5e/server"
package = "dnd5e-server"

[dependencies.genie_server]
path = "../../packs/systems/genie/server"
package = "genie-server"

[dependencies.pathfinder2e_server]
path = "../../packs/systems/pathfinder2e/server"
package = "pathfinder2e-server"

[dependencies.cypher_server]
path = "../../packs/systems/cypher_system/server"
package = "cypher-server"

[dependencies.fate_server]
path = "../../packs/systems/fate_core/server"
package = "fate-server"

[dependencies.blades_server]
path = "../../packs/systems/blades_in_the_dark/server"
package = "blades-server"

[dependencies.yze_server]
path = "../../packs/systems/year_zero_engine/server"
package = "yze-server"
