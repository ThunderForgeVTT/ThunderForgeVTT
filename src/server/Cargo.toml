[package]
name = "thunderforge"
version = "0.1.0"
authors = ["mbround18 <12646562+mbround18@users.noreply.github.com>"]
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license = "BSD 3-Clause License"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "thunderforge"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.1", features = ["derive"] }
serde_derive = "1.0.228"
websocket = "0.27.1"
base64 = "0.22.1"
include_dir = "0.7.4"
dotenvy = "0.15.7"
argon2 = "0.5.3"
async-recursion = "1.1.1"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors"] }
tower-cookies = { version = "0.11.0", features = ["private"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-bunyan-formatter = "0.3.9"
futures-util = "0.3.32"
tokio-stream = { version = "0.1.18", features = ["sync"] }
async-graphql = { version = "7.2.1", features = [
  "chrono",
  "dataloader",
  "log",
  "uuid",
] }
async-graphql-axum = "7.2.1"
diesel = { version = "2.3.9", features = [
  "postgres",
  "r2d2",
  "chrono",
  "uuid",
  "serde_json",
] }
chrono = { version = "0.4.44", features = ["serde"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
uuid = { version = "1.23.1", features = ["serde", "v7"] }
reqwest = { version = "0.13.3", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
rand = "0.10.1"
sha2 = "0.11.0"
url = "2.5.8"
thiserror = "2.0.18"
aes-gcm = "0.10.3"
totp-rs = { version = "5.7.0", features = ["otpauth"] }
data-encoding = "2.9.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dependencies.thunderforge_core]
path = "../core"
