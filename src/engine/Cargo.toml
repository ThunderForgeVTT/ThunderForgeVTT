[lints]
workspace = true

[package]
name = "thunderforge_engine"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Real names for systems, components and resources in Bevy's own messages.
#
# `bevy_utils::DebugName` is the sole thing this gates. Without it every Bevy
# diagnostic that names a subject prints the literal string
# "<Enable the debug feature to see the name>" — so `error[B0002]` arrives as
# "Res<<Enable the debug feature to see the name>> in system <Enable the debug
# feature to see the name> conflicts with a previous system parameter", and
# `resource does not exist` never says which one. There are 33 files in
# `bevy_ecs` alone that name a subject this way.
#
# That is the same failure this crate has already paid for twice: `bevy_log`
# is enabled above precisely so Bevy's errors reach the browser console, and
# the render-halves comment below records a day lost to a renderer that failed
# without saying so. Routing those messages to the console and then reading a
# placeholder where the subject should be is most of the way to not having
# them at all.
#
# Not on by default, and deliberately not in the release bundle: the names are
# `type_name` string *data*, which survives the symbol stripping that takes
# the release build from 24.7MB to 4.15MB brotli. `scripts/shared.mjs` turns
# it on for the `--dev` wasm-pack profile, where 71% of the bundle is already
# unmangled symbols and the marginal cost is noise.
debug-names = ["bevy/debug"]

[dependencies]
thunderforge_canvas_core = { path = "../../crates/thunderforge-canvas-core" }
# Spec 028 (T027): the client world cache. `cache_core` holds the rules the
# server and this engine must agree on — chiefly `fingerprint::verify`, the
# only sanctioned way anything here decides bytes are what they claim to be.
# `cache_browser` is the OPFS/WebCrypto/IndexedDB half; its wasm toolchain is
# confined to a `cfg(target_arch = "wasm32")` block in its own manifest, so
# depending on it unconditionally pulls no `web-sys` into a native build.
thunderforge_cache_browser = { path = "../../crates/thunderforge-cache-browser" }
thunderforge_cache_core = { path = "../../crates/thunderforge-cache-core" }
thunderforge_dice = { path = "../../crates/thunderforge-dice" }
bevy = { version = "0.19.1", default-features = false, features = [
  "bevy_asset",
  # Without this, `LogPlugin` is absent and every Bevy-side `error!`/`warn!`
  # goes nowhere. That silence made real rendering bugs undiagnosable from
  # the browser: a forbidden asset path and a duplicate-camera warning were
  # both being logged every frame and reaching no one, while the canvas just
  # stayed empty. On wasm this routes tracing output to the browser console.
  # Keep it enabled — the cost is a little console noise, the alternative is
  # a renderer that fails silently.
  "bevy_log",
  "bevy_core_pipeline",
  # Gizmos draw through the polyline pipeline rather than the sprite
  # pipeline, which makes them a diagnostic that sprites cannot provide:
  # they answer "is the 2D render graph running at all" independently of
  # whether `bevy_sprite` is producing draw calls. See `RenderProbePlugin`.
  "bevy_gizmos",
  "bevy_render",
  "bevy_sprite",
  # THE RENDER HALVES. In Bevy 0.18 each of these subsystems is split in two:
  # `bevy_sprite`/`bevy_ui`/`bevy_gizmos` provide the components and the
  # main-world logic, while `*_render` provides the crate that actually draws
  # them (extraction, queueing, pipelines). Enabling only the first half of
  # each pair compiles and runs perfectly happily — components exist,
  # visibility is computed, assets load, the camera renders and clears the
  # target — and then nothing is ever queued to draw, so the canvas shows
  # nothing but the clear colour, with no error anywhere.
  #
  # Diagnosed by tracing the render world directly (`RenderProbePlugin`):
  # `RenderVisibleEntities<Sprite> = 3` and `Transparent2d items = 0` at the
  # same instant, i.e. the view could see the sprites and no system existed to
  # queue them.
  "bevy_sprite_render",
  # `bevy_ui`/`bevy_ui_render` are currently unused: the only UI node in the
  # crate was a one-line debug HUD, removed once it turned out to be pulling
  # in two crates (including a whole render pipeline with its own extraction,
  # queueing and batching) to draw a single string of developer text.
  #
  # Kept anyway, deliberately. Dropping them shrinks the bundle, but the
  # release build already lands at ~4.15MB brotli, so the remaining size win
  # is small — and re-adding a render pipeline later is far more disruptive
  # than carrying it. If you are trimming features for size, measure first:
  # this is not the one that matters.
  "bevy_ui_render",
  "bevy_gizmos_render",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "png",
  # Native canvas authoring: DungeonDraft's Universal VTT exporter uses
  # WebP for background map art (verified against examples/maps/demo.dd2vtt),
  # not just PNG — src/server/src/map_import.rs accepts and saves both.
  "webp",
  "webgl2",
] }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
gloo-net = { version = "0.7", features = ["http"] }
wasm-bindgen-futures = "0.4"
futures-util = "0.3"
once_cell = "1.21"
uuid = { version = "1.26.0", features = ["serde"] }
