[lints]
workspace = true

[package]
name = "thunderforge_engine"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license = "BSD 3-Clause License"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thunderforge_canvas_core = { path = "../../crates/thunderforge-canvas-core" }
thunderforge_dice = { path = "../../crates/thunderforge-dice" }
bevy = { version = "0.18.1", default-features = false, features = [
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "png",
  # Native canvas authoring: DungeonDraft's Universal VTT exporter uses
  # WebP for background map art (verified against examples/maps/demo.dd2vtt),
  # not just PNG — src/server/src/map_import.rs accepts and saves both.
  "webp",
  "webgl2",
] }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.120"
js-sys = "0.3.97"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen-futures = "0.4"
futures-util = "0.3"
once_cell = "1.20"
