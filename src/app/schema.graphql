	"It is Ogre's turn" for `NOT_YOUR_TURN`. The same words the live move
	is refused with, so a queued move and a dragged one say the same thing.
	"""
	refusal: String
}

"""
Why a queued change did not stand. Mirrors
`thunderforge_cache_core::queue::RejectionReason`.
"""
enum GraphQLRejectionReason {
	"""
	The user may no longer make this change (FR-042).
	"""
	PERMISSION_DENIED
	"""
	A conflicting change took precedence. Deliberately distinct from a
	generic failure: it is a working rule, not an error, and the UI has to
	be able to say which.
	"""
	SUPERSEDED
	"""
	The thing being changed no longer exists.
	"""
	GONE_AWAY
	"""
	Malformed, or outside what may be edited offline (FR-035a).
	"""
	INVALID
	"""
	An operator paused play in this world (spec 051 FR-023). Nothing in the
	batch is applied, and the client discards it rather than retrying.
	"""
	PLAY_PAUSED
	"""
	A combat is running in the scene and it is somebody else's turn
	(spec 046 C1). `refusal` on the outcome says whose.
	"""
	NOT_YOUR_TURN
}

"""
What removing this compendium would take with it, and what it would leave
(FR-045, FR-046).

Returned by both calls. With `confirm: false` it is the whole answer and
nothing has changed; with `confirm: true` it describes what was removed.
"""
type GraphQLRemovalReport {
	compendiumId: UUID!
	bookTitle: String!
	"""
	How many entries this import contributed, all of which go.
	"""
	entryCount: Int!
	"""
	Where those entries are in use today, per world.
	
	One row per world with this book switched on (050 FR-060). Because
	nothing was copied into a world, "in use" is not a subset to compute:
	a table running the book loses all of it, and that is what this says.
	"""
	inUse: [GraphQLCompendiumUsage!]!
	"""
	Entries a table has changed or hidden over this book, which go with it
	(FR-046), each prefixed with the world it is in.
	
	Under spec 050 a hand edit is a world's delta over the base, never a
	change to `compendium_entries`, which is also why a re-import cannot
	silently overwrite one. `deltasByWorld` carries the same, per world,
	beside what stays.
	"""
	handEdited: [String!]!
	"""
	Per world, what removing the book does to that table's own work:
	changes and hides are lost, additions are **kept** (spec 050 decision
	5). Includes worlds that have switched the book off and kept an
	addition, which `inUse` does not name.
	"""
	deltasByWorld: [RemovalWorldDeltas!]!
	"""
	Whether this call removed anything. False for the report, true for the
	confirmation — so a caller can never mistake one reply for the other.
	"""
	removed: Boolean!
}

"""
One resource, as one viewer receives it.

The three payload fields are mutually exclusive and only one is ever
populated. GraphQL cannot express a discriminated union over scalars, so
the exclusivity is enforced where the value is produced (`disclose`) rather
than by the schema — and the type it comes from *can* express it, which is
why the coarsening happens there and not here.
"""
type GraphQLResolvedResource {
	definitionId: String!
	label: String!
	"""
	`bar` or `counter`.
	"""
	kind: String!
	"""
	`visible`, `greyed`, `percentage` or `chunked`.
	"""
	disclosure: String!
	"""
	Populated only when `disclosure` is `visible`.
	"""
	entries: [GraphQLResourceEntry!]
	"""
	Populated only when `disclosure` is `percentage`. No maximum is sent.
	"""
	proportion: Float
	"""
	Populated only when `disclosure` is `chunked`. 0-4.
	"""
	quarter: Int
	"""
	What everyone who does not run the world sees for this resource.
	
	Present only for a viewer who *does* run it. A Game Master's own
	`disclosure` is always `visible`, so it cannot tell them what the table
	is under — and a control that guessed would show a setting nobody is
	actually playing with. Absent for a player, who has no business knowing
	which of the four states they are being shown through.
	"""
	configured: String
}

