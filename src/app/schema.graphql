	copied: what this writes is a row saying the world reads that book.
	"""
	switchOnCompendium(worldId: UUID!, compendiumId: UUID!): [WorldBook!]!
	"""
	Switch a book off, or ask first what that takes (FR-013, FR-032).
	
	With `confirm: false` nothing changes and the reply is the warning.
	"""
	switchOffCompendium(worldId: UUID!, compendiumId: UUID!, confirm: Boolean!): BookSwitchOffReport!
	"""
	Change what an entry says in this world, and in no other world and not
	in the book (050 FR-020, FR-023). Send `fieldValues` for an entry read
	as fields — only the ones named are touched — or `proseText` for prose.
	"""
	changeWorldEntry(worldId: UUID!, compendiumId: UUID!, kind: String!, name: String!, fieldValues: JSON, proseText: String): WorldEntry
	"""
	Stop showing an entry in this world. Every other world still has it.
	"""
	hideWorldEntry(worldId: UUID!, compendiumId: UUID!, kind: String!, name: String!): WorldEntry
	"""
	Write an entry into this world beside the book. Authored, and so
	shareable, however uploaded the book beside it is (050 FR-052a).
	"""
	addWorldEntry(worldId: UUID!, compendiumId: UUID!, kind: String!, name: String!, fieldValues: JSON, proseText: String): WorldEntry
	"""
	Remove an addition this table kept after its book was switched off or
	removed from the shelf (spec 050 decision 5), by the addition's id —
	the only address an addition whose book is gone still has.
	"""
	removeKeptAddition(worldId: UUID!, additionId: UUID!): Boolean!
	"""
	Put an entry back as the book has it, or take an addition out
	(050 FR-024).
	"""
	restoreWorldEntry(worldId: UUID!, compendiumId: UUID!, kind: String!, name: String!): WorldEntry
	attachAbilityToActor(input: AttachAbilityToActorInput!): GraphQLActorAbilityEntry!
	detachAbilityFromActor(entryId: UUID!): Boolean!
	createItem(input: CreateItemInput!): GraphQLItem!
	updateItem(input: UpdateItemInput!): GraphQLItem!
	deleteItem(itemId: UUID!): Boolean!
	addItemEffect(itemId: UUID!, effect: ItemEffectInput!): GraphQLItemEffect!
	updateItemEffect(effectId: UUID!, effect: ItemEffectInput!): GraphQLItemEffect!
	removeItemEffect(effectId: UUID!): Boolean!
	"""
	DM-only. Grants an item-level permission to one world member.
	"""
	setItemPermission(input: SetItemPermissionInput!): GraphQLItemPermission!
	"""
	DM-only. Clears a member's explicit grant, returning them to the implicit `Viewer` default. `false` means there was no grant to clear.
	"""
	removeItemPermission(itemId: UUID!, userId: UUID!): Boolean!
	"""
	Spec 039 FR-001/FR-002: `attestation` is **non-null**.
	"""
	createItemShareLink(itemId: UUID!, attestation: AttestationInput!): GraphQLItemShareLink!
	revokeItemShareLink(shareId: UUID!): Boolean!
	copySharedItemToWorld(input: CopySharedItemInput!): GraphQLItem!
	setItemPrice(input: SetItemPriceInput!): GraphQLItemPrice!
	clearItemPrice(itemId: UUID!): Boolean!
	addItemToInventory(input: AddItemToInventoryInput!): GraphQLInventoryEntry!
	adjustInventoryQuantity(input: AdjustInventoryQuantityInput!): GraphQLInventoryEntry
	removeInventoryEntry(inventoryEntryId: UUID!): Boolean!
	"""
	Take a placed item off the map and into a character's inventory.
	
	All-or-nothing, and exactly one caller wins a contested item.
	"""
	pickUpPlacedItem(input: PickUpPlacedItemInput!): GraphQLInventoryEntry!
	"""
	Bring the party's characters to a scene, creating a token for each one
	that does not already have one there.
	
	Idempotent per character: calling it twice leaves the same tokens
	standing as calling it once.
	"""
	bringPartyToScene(input: BringPartyToSceneInput!): GraphQLPartyArrival!
	submitTakedownNotice(input: SubmitTakedownNoticeInput!): GraphQLModerationCase!
	submitCounterNotice(input: SubmitCounterNoticeInput!): GraphQLModerationCase!
	resolveModerationCase(caseId: UUID!, resolution: ModerationActionType!): GraphQLModerationCase!
	"""
	File an appeal against a disablement (FR-031). One per decision.
	
	**Callable by a disabled account** — it is one of the two remedies.
	Filing it pauses the deletion if it is still open when the window ends
	(FR-034), and writes nothing to the download (FR-032).
	"""
	fileAppeal(statement: String!): Termination!
	"""
	Decide an appeal. Admin only.
	
	`overturnedCaseId` names the strike the appeal overturned; omitted, it
	is the most recent — the one that crossed the threshold.
	"""
	resolveAppeal(accountId: UUID!, upheld: Boolean!, note: String, overturnedCaseId: UUID): Termination!
	"""
	Carry out a window that waits for a person (FR-040's default). Admin
	only; refused before the date, while an appeal is open, and for the
	instance's last administrator.
	"""
	executeTermination(accountId: UUID!): Boolean!
	"""
	Acknowledge the operator statement this build ships (FR-044). Admin
	only.
	
	Only the **current** version is accepted — acknowledging words that are
	no longer in force would be a record of nothing. Acknowledging the
	current version twice is not an error; the instance already holds it.
	"""
	acknowledgeOperatorStatement(attestation: AttestationInput!): OperatorAcknowledgementState!
	rollDice(input: RollDiceInput!): GraphQLRollResolution!
	"""
	Roll a check the world's system declares, against one actor's values.
	
	Resolved server-side and recorded exactly as `rollDice` is. There is
	deliberately no formula argument, no value argument and no outcome
	argument: the dice, the numbers and the result are the system's and the
	server's, never the sheet's (FR-035).
	"""
	rollCheck(worldId: UUID!, actorId: UUID!, checkId: String!): GraphQLRollResolution!
	claimActor(worldId: UUID!, actorId: UUID!): GraphQLActorClaim!
	createAndClaimActor(worldId: UUID!, name: String!, description: String): GraphQLActorClaim!
	setActorAvailability(actorId: UUID!, available: Boolean!): GraphQLWorldActor!
	"""
	Free a claimed character. `expected_world_member_id` names the claim
	the caller was looking at, so a release cannot land on one it never
	saw (spec 031 FR-034).
	"""
	unclaimActor(actorId: UUID!, expectedWorldMemberId: UUID): GraphQLWorldActor!
	"""
	Set (or clear, with a null `actor_id`) which character a player is
	playing — the players section's writer of the claim relation.
	"""
	setPlayerCharacterBinding(worldId: UUID!, worldMemberId: UUID!, actorId: UUID): GraphQLWorldActor
	"""
	Grant (`granted: true`) or revoke a single authoring tool for a single
	member of a world. Owner/GM only. Returns that member's grants after
	the write.
	"""
	setAuthoringToolGrant(worldId: UUID!, worldMemberId: UUID!, tool: String!, granted: Boolean!): [String!]!
	sendChatMessage(input: SendChatMessageInput!): GraphQLChatMessage!
	startCombat(input: StartCombatInput!): GraphQLCombat!
	addCombatant(input: AddCombatantInput!): GraphQLCombat!
	updateCombatant(input: UpdateCombatantInput!): GraphQLCombat!
	removeCombatant(combatantId: UUID!): GraphQLCombat!
	advanceTurn(combatId: UUID!): GraphQLCombat!
	endCombat(combatId: UUID!): GraphQLCombat!
	"""
	Damage or heal a creature by hand. Game Master only.
	
	Temporary hit points absorb damage first, current stops at zero, and
	healing stops at the maximum. A creature taken to zero is marked out of
	the running combat; healed above zero, it is back in — unless the Game
	Master took it out by hand.
	"""
	changeHitPoints(tokenId: UUID!, kind: HitPointChange!, amount: Int!): TokenHitPoints!
	"""
	Make an attack against a target, or at nothing (spec 046 US1).
	
	Rolled and judged on the server. A player is refused on somebody
	else's turn unless it is a reaction; a hit's damage is offered to
	whoever controls the target. Several attacks for a multiattack.
	"""
	makeAttack(input: AttackInput!): [Attack!]!
	"""
	Take or decline an offer, once. By a controller of its creature, or a
	Game Master on their behalf.
	"""
	resolveOffer(offerId: UUID!, take: Boolean!): Offer!
	"""
	Whether hits on NPCs the Game Master runs are applied without an
	offer, by default, in this world. Off unless switched on.
	"""
	updateWorldAutoApplyNpcDamage(input: UpdateWorldAutoApplyNpcDamageInput!): GraphQLWorld!
	"""
	Override auto-apply for one encounter; null returns to the world's.
	"""
	setCombatAutoApply(combatId: UUID!, enabled: Boolean): GraphQLCombat!
	"""
	What an ability is as an attack: reach, range, line of sight, cost and
	multiattack.
	"""
	setAbilityAttack(abilityId: UUID!, attack: AttackFieldsInput!): Boolean!
	"""
	What an item is as an attack.
	"""
	setItemAttack(itemId: UUID!, attack: AttackFieldsInput!): Boolean!
	"""
	Replay changes made while disconnected, and report what became of
	each (US7).
	
	Applied in submitted order, so a client's own sequential edits do not
	reorder against each other — replaying "move right, then move up"
	backwards lands the token somewhere the user never put it.
	"""
	reconcileQueuedChanges(worldId: UUID!, changes: [QueuedChangeInput!]!): [GraphQLReconcileOutcome!]!
	"""
	Report that this client is still present in a world.
	
	Membership is checked on every beat rather than once at connect: a
	heartbeat is exactly the moment to notice that someone's access was
	revoked while they sat idle, and refusing it is how their client finds
	out.
	"""
	heartbeat(worldId: UUID!, sceneId: UUID): Boolean!
	"""
	Relay one opaque signaling payload to one session in one world.
	
	`false` means it was not delivered — the addressed session has ended,
	or is no longer a member. Neither is retried and neither is queued.
	"""
	sendPeerSignal(input: PeerSignalInput!): Boolean!
	"""
	Pause `worldId`'s play, on `grounds`.
	
	Refuses blank grounds with `GROUNDS_REQUIRED` and a world that does not
	exist with `WORLD_NOT_FOUND`. Nothing else is needed after it returns:
	the event it records moves honest clients within a moment, and every
	open stream into the world ends on its next tick.
	"""
	pauseWorldPlay(worldId: UUID!, grounds: String!): PauseOutcome!
	"""
	Approve or decline a request to pause a world, with a `note`.
	
	Approving pauses the world exactly as `pauseWorldPlay` does, the note
	as its grounds. Declining changes nothing any member of the world can
	see (FR-034). Refuses a blank note with `GROUNDS_REQUIRED` and an
	unknown request with `REQUEST_NOT_FOUND`. A request somebody already
	decided is not an error: `decidedHere` is false and the request says
	who decided it, and how (FR-035).
	"""
	decidePlayPauseRequest(requestId: UUID!, decision: PauseDecision!, note: String!): PauseDecisionOutcome!
	"""
	Lift `pauseId`, on `grounds`, so the world's live play can start again.
	
	Sets the lift and nothing else: a scene taken down while the world was
	paused stays withheld, and no membership changes (FR-041, FR-042).
	Refuses blank grounds with `GROUNDS_REQUIRED` and an unknown pause with
	`PAUSE_NOT_FOUND`. A pause somebody already lifted is refused with
	`PAUSE_ALREADY_LIFTED`, whose extensions say who (`liftedBy`) and when
	(`liftedAt`), so the second operator knows the world is already free.
	"""
	liftWorldPlayPause(pauseId: UUID!, grounds: String!): PlayPause!
	startGenieSession(input: StartGenieSessionInput!): GraphQLGenieSession!
	spendWish(sessionId: UUID!, narrativeEffect: String!): GraphQLGenieSession!
	advanceDoomClock(sessionId: UUID!, delta: Int!): GraphQLGenieSession!
	createPuzzleClock(sessionId: UUID!, label: String!, segmentsMax: Int!): GraphQLGeniePuzzleClock!
	advancePuzzleClock(clockId: UUID!, delta: Int!, actorId: UUID): GraphQLGeniePuzzleClock!
	grantSessionResource(sessionId: UUID!, actorId: UUID!, resourceType: String!, amount: Int!): GraphQLGenieResourceHolding!
	createShopListing(actorId: UUID!, itemId: UUID!, priceKind: GenieShopPriceKind!, priceResourceType: String, priceResourceAmount: Int, priceItemId: UUID, priceItemQuantity: Int): GraphQLGenieShopListing!
	purchaseFromShop(listingId: UUID!, buyerActorId: UUID!): GraphQLGenieShopListing!
	configurePuzzleClockReward(clockId: UUID!, triggerSegment: Int!, rewardResourceType: String, rewardResourceAmount: Int, rewardItemId: UUID, rewardItemQuantity: Int, recipientMode: GenieRewardRecipientMode!): GraphQLGeniePuzzleClockReward!
	proposeResourceTrade(sessionId: UUID!, fromActorId: UUID!, fromResourceType: String!, fromQuantity: Int!, toActorId: UUID!, toResourceType: String!, toQuantity: Int!): GraphQLGenieTradeProposal!
	acceptResourceTrade(proposalId: UUID!): [GraphQLGenieResourceHolding!]!
	declineResourceTrade(proposalId: UUID!): GraphQLGenieTradeProposal!
	spendResourceOnPuzzleClock(clockId: UUID!, actorId: UUID!, resourceType: String!, quantity: Int!): GraphQLGeniePuzzleClock!
}

"""
Everything queryable: the product's own roots, then each pack's.
"""
type AppQueryRoot {
	"""
	Who is present in a world, and who has gone quiet.
	
	Returns everyone with a presence row, including those past the
	timeout, with `connected: false`. Filtering them out here would make a
	player who dropped simply vanish from the Game Master's list, which is
	indistinguishable from them never having been there — and "they were
	here and stopped" is the whole thing worth reporting.
	"""
	worldPresence(worldId: UUID!): [GraphQLPresence!]!
	healthcheck: Boolean!
	me: GraphQLUser
	myWorlds: [GraphQLWorld!]!
	"""
	Every world the caller owns or is an accepted member of (any role),
	paired with their role — powers the Welcome page hub, which should
	show a user's full roster (owned AND joined-as-player worlds), not
	just `myWorlds`' owned-only list.
	"""
	myWorldsWithRole: [GraphQLMyWorldEntry!]!
	"""
	Spec 010 (research.md §8): worlds where the caller holds DM-level
	access — Owner (`created_by`) OR an accepted `GM` `world_members`
	row. Deliberately additive alongside `myWorlds` (which only covers
	`created_by`) rather than changing that query's existing behavior;
	used by the "Copy to World" destination picker.
	"""
	myDmWorlds: [GraphQLWorld!]!
	world(id: UUID!): GraphQLWorld
	myWorldTokens: [GraphQLWorldToken!]!
	worldToken(tokenId: String!): GraphQLWorldToken
	myWorldEvents: [GraphQLWorldEvent!]!
	worldEvent(eventId: Int!): GraphQLWorldEvent
	exportMyData: GraphQLExportMyDataPayload!
	allWorlds: [GraphQLWorld!]!
	adminWelcomeSummary: GraphQLAdminWelcomeSummary!
	adminStats: GraphQLAdminStats!
	systemManifest: GraphQLSystemManifest!
	oauthProviders: [GraphQLOAuthProvider!]!
	authSecuritySettings: GraphQLAuthSecuritySettings!
	"""
	Spec 041 FR-021. Counts, never a list of accounts — see
	[`GraphQLTwoFactorCoverage`].
	"""
	twoFactorCoverage: TwoFactorCoverage!
	"""
	Spec 041 US6/US7: find the one account an operator has been asked to
	help, by exact username or email.
	
	Not a roster and not a prefix search. An operator with a real reason to
	act on somebody's second factor already knows which account it is,
	because that person has just asked them; a browsable list of who has no
	second factor is a target list for whoever takes over this session.
	"""
	adminAccount(identifier: String!): AdminAccount
	adminBootstrapSettings: GraphQLAdminBootstrapSettings
	scenes(worldId: UUID!): [GraphQLScene!]!
	scene(sceneId: UUID!): GraphQLScene
	tokens(sceneId: UUID!): [GraphQLToken!]!
	fogMask(sceneId: UUID!): GraphQLFogMask
	walls(sceneId: UUID!): [GraphQLWall!]!
	"""
	Returns all light sources for the scene. Light effects are
	player-visible by nature (FR-005) — there is no GM-only light data,
	so any authenticated scene participant may read this list.
	"""
	lightSources(sceneId: UUID!): [GraphQLLightSource!]!
	"""
	Shapes drawn on a scene's canvas (native canvas authoring). Returns
	every shape to the scene owner/GM; returns only
	`visible_to_players = true` shapes to any other authenticated
	scene participant (FR-009: players never see GM-only shapes).
	"""
	shapes(sceneId: UUID!): [GraphQLShape!]!
	"""
	Every token on a scene, with each one's resources reduced to what this
	viewer is entitled to see.
	"""
	tokenStatus(sceneId: UUID!): [GraphQLTokenStatus!]!
	"""
	Attribute scores for every token in a scene that has any.
	
	A token with no actor, or an actor whose sheet is unfilled, is omitted
	rather than returned empty — an empty list would say "this character
	has no attributes", which is a claim about the ruleset rather than
	about the sheet.
	"""
	tokenAttributes(sceneId: UUID!): [GraphQLTokenAttributes!]!
	"""
	Vision for every token in a scene whose system declares any and whose
	character has some.
	
	A token that resolves to ordinary sight is **omitted**, not returned as
	zeroes. The list is "who sees unusually", and an entry saying "this
	creature sees nothing special" is the same claim as no entry, with more
	rows.
	"""
	tokenVision(sceneId: UUID!): [GraphQLTokenVision!]!
	"""
	Every token in the scene that fills something other than one square:
	a linked token by its actor's size, a copy by its NPC's, as the world's
	game system declares sizes (`combat.sizes`).
	
	A token of one square is **omitted**. The client tells the engine `1`
	for every token it does not find here, so a creature that shrinks back
	to Medium shrinks on every board.
	"""
	tokenGrid(sceneId: UUID!): [TokenGrid!]!
	sceneExploration(sceneId: UUID!): GraphQLSceneExploration!
	"""
	What this build can perform.
	
	Drives the authoring form, so a Game Master is offered exactly what
	exists and never an option that would silently do nothing (FR-038).
	"""
	effectRegistry: [GraphQLEffectDeclaration!]!
	"""
	What is waiting on a decision in this scene. Game Master only.
	
	A player is not shown the queue. Their own outcome reaches them
	directly, and the rest of it is a list of what other people asked for —
	which is the Game Master's business and, at some tables, information
	the GM is deliberately not sharing yet.
	"""
	pendingInteractionRequests(sceneId: UUID!): [GraphQLInteractionRequest!]!
	"""
	Every interactive on a scene, as this viewer may know it.
	"""
	interactives(sceneId: UUID!): [GraphQLInteractive!]!
	"""
	The tool ids the caller may author with in this world.
	
	About the caller and nobody else. A Game Master configuring another
	member's tools needs a different question — one that names a subject
	and is DM-gated — and answering both from one field would make it easy
	to ship the second without the gate.
	
	An empty list is the honest answer for a player in a world whose Game
	Master has granted nothing, which today is every world (FR-045).
	"""
	authoringTools(worldId: UUID!): [String!]!
	"""
	Every grant handed out in this world, for the Game Master configuring
	them (FR-046).
	
	DM-gated, which is the reason it is a second field rather than an
	argument on the first: a query that answers both "what may I use" and
	"what may they use" would have one of its two answers guarded and the
	other not, and the guard is easy to leave off the day the argument is
	added.
	
	Members with no grants are simply absent. The settings page has the
	roster already and reads an absent member as "nothing", which is the
	same default the resolver applies.
	"""
	authoringToolGrants(worldId: UUID!): [GraphQLMemberAuthoringTools!]!
	"""
	Get all invites for a world (Owner/GM only)
	"""
	worldInvites(worldId: UUID!): [WorldInvitePayload!]!
	"""
	Get all members of a world
	"""
	worldMembers(worldId: UUID!): [WorldMembershipPayload!]!
	"""
	Get a specific member's info
	"""
	worldMember(worldId: UUID!, userId: UUID!): WorldMembershipPayload
	"""
	Get world info by invite code (for /join/:code landing page)
	"""
	worldByInviteCode(code: String!): WorldPreviewPayload
	"""
	Check if current user is already a member of world via invite code
	"""
	alreadyMember(code: String!): Boolean!
	"""
	The sharing terms in force right now, and the identity to attest to.
	
	Requires a session — you cannot publish without one — and is cheap: the
	body is a compiled-in constant and the hash is computed from it.
	"""
	sharingTerms: VersionedLegalDocument!
	"""
	What an operator takes on (US8).
	
	**Readable without a session** (FR-045), unlike the sharing terms: the
	person it is shown to is setting an instance up and does not have an
	account yet, and it is a statement about responsibility rather than
	anything about this instance's contents.
	"""
	operatorStatement: VersionedLegalDocument!
	"""
	One archived version, by id — what an old attestation actually said.
	
	Admin-only, for the reason `moderationCase` is: this is the
	notice-handling surface, not a public archive. Resolved from
	`terms_versions` and **never** from the compiled-in constant, which is
	the failure FR-008 exists to prevent and the easiest one to write by
	accident.
	
	`None` for an identity that was never archived, rather than an error: an
	operator pasting an id from an email should be told there is no such
	version, not handed a stack trace.
	"""
	legalDocumentVersion(versionId: String!): VersionedLegalDocument
	"""
	Every agreement under which one thing has been published, newest first
	— its own, and those of every collection it is currently in.
	
	The SC-003 surface: a person handling a notice reaches who agreed, when
	and the exact words in one query, without a developer. Admin-only for
	the reason `moderationCase` is. `publishableKind` also accepts `lore`
	and `scene`, which are never published alone and so are answered
	entirely through their collections.
	
	Returned whether or not the share each one authorised still exists
	(FR-007) — there is no join to a share row and no filter on one.
	"""
	attestationsFor(publishableKind: String!, publishableId: UUID!): [Attestation!]!
	"""
	The caller's own attestations, newest first. Reachable by a
	**disabled** account (`standing-and-termination.md`).
	"""
	myAttestations(limit: Int): [Attestation!]!
	"""
	The caller's own standing (FR-029). Reachable by a **disabled** account:
	the person has to be able to see the window and the date.
	"""
	myStanding: Standing!
	"""
	Anyone's standing. Admin-only, for the reason `moderationCase` is.
	"""
	accountStanding(accountId: UUID!): Standing!
	"""
	What the caller has been told about their own account, newest first
	(FR-028).
	"""
	myNotices(limit: Int): [AccountNotice!]!
	"""
	The acknowledgement this instance holds, and whether it is of the words
	this build ships. Admin only.
	"""
	instanceOperatorAcknowledgement: OperatorAcknowledgementState!
	canvasImageAssetsForScene(sceneId: UUID!): [GraphQLCanvasImageAsset!]!
	"""
	All actors (NPCs and player characters, distinguished by `isNpc`)
	belonging to a world, across every scene. World-scoped (not
	scene-scoped) to match how a GM staging page shows one roster for
	the whole world (research.md §2).
	"""
	worldActors(worldId: UUID!): [GraphQLWorldActor!]!
	"""
	Read an actor's system-specific data (ability/resource/proficiency/
	trait/spell_data) — the read counterpart to `updateActorSystemData`.
	Returns `null` if the actor has no system data row yet.
	"""
	actorSystemData(actorId: UUID!): GraphQLActorSystemData
	"""
	Everything this actor's system publishes about it — the read a
	character sheet needs, where `tokenAttributes` answers for a scene.
	"""
	actorDeclaredValues(actorId: UUID!): [GraphQLDeclaredValue!]!
	"""
	The same values, already in the sets a sheet lays out.
	
	`actorDeclaredValues` sends one flat list, which left a renderer with
	six sets to fill and nothing to fill them from: everything a system
	published landed in `other`, so Forge's Attributes and Resources
	sections were empty for every system that has them.
	
	A value's set is a fact about which block of the manifest declared it,
	and the server is the side that reads the manifest. Producing the named
	sets and `all` in one pass is also what stops them disagreeing (T019h).
	"""
	actorSheet(actorId: UUID!): GraphQLActorSheet!
	"""
	Server-side search pairing for the client's FlexSearch index —
	see `search_actors_impl`.
	"""
	searchActors(worldId: UUID!, query: String!): [GraphQLWorldActor!]!
	"""
	FR-014: only the DM may view or change the ownership block. Returns only explicit rows — members with no row default to Viewer, which the client renders itself by combining this with the full `worldMembers` roster (contracts/actor-permissions.md).
	"""
	actorPermissions(actorId: UUID!): [GraphQLActorPermission!]!
	"""
	ADR-071: the active share link for a actor the caller owns, or null.
	**Authenticated**, and scoped to one actor the caller already has
	authority over — see `actor_share_link_impl` for why this is not
	enumeration.
	"""
	actorShareLink(actorId: UUID!): GraphQLActorShareLink
	"""
	**Deliberately unauthenticated** — ADR-071. Do not add
	`authenticated_user(ctx)?` here; it was removed on purpose, and all four
	share reads now agree. The caller is identified only to rate-limit them.
	"""
	sharedActor(shareCode: String!): SharedActorPreview!
	"""
	Admin-only. The unauthenticated surface reads the policy from
	`/authentication/setup/status` instead (FR-003).
	"""
	instanceAccessSettings: InstanceAccessSettings!
	"""
	Admin-only. FR-004 and FR-012's record, newest first.
	"""
	instanceAccessEvents(limit: Int): [InstanceAccessEvent!]!
	"""
	Admin-only. Note there is no `instanceInvitation(code:)` counterpart,
	and none may be added — see this module's header.
	"""
	instanceInvitations: [InstanceInvitation!]!
	"""
	Every scope, plus how each subsystem currently resolves. Administrators
	only — a client ID is not a secret, but which applications an instance
	holds is not a stranger's business either.
	"""
	githubApplications: [GithubApplication!]!
	"""
	Every declared setting, resolved, with its source. Administrators only.
	"""
	instanceSettings: [ResolvedSetting!]!
	"""
	The change history for one setting, newest first. Administrators only.
	"""
	instanceSettingChanges(key: String!, limit: Int): [SettingChange!]!
	"""
	What this instance can and cannot do, given how it is configured.
	Derived on every read, never stored. Administrators only.
	"""
	instanceReadiness: InstanceReadiness!
	"""
	Whether this instance can send mail, and what to set if it cannot.
	Administrators only.
	"""
