	lorePendingChanges(worldId: UUID!): [GraphQLLorePendingChange!]!
	instanceRepositoryIntegration: RepositoryIntegrationStatus!
	worldAbilities(worldId: UUID!, search: String): [GraphQLAbility!]!
	ability(abilityId: UUID!): GraphQLAbility!
	suggestAbilityName(worldId: UUID!, name: String!): [GraphQLAbility!]!
