	"""
	sharedItem(shareCode: String!): SharedItemPreview!
	actorInventory(actorId: UUID!): [GraphQLInventoryEntry!]!
	moderationStatus(entityType: ModerationEntityType!, entityId: UUID!): ModerationActionType
	moderationCase(caseId: UUID!): GraphQLModerationCase
	moderationHistoryForAccount(accountId: UUID!): [GraphQLModerationCase!]!
	repeatInfringerFlags: [UUID!]!
	worldRollRecords(worldId: UUID!, limit: Int): [GraphQLRollRecord!]!
	validateDiceFormula(formula: String!): Boolean!
	myActorClaim(worldId: UUID!): GraphQLActorClaim
	availableActors(worldId: UUID!): [GraphQLWorldActor!]!
	"""
	This world's chat backscroll, oldest-first. GM-only messages are
	omitted entirely for non-GM callers.
	"""
	worldChatMessages(worldId: UUID!, limit: Int): [GraphQLChatMessage!]!
	"""
	This world's running combat, or null when none is in progress.
	"""
	activeCombat(worldId: UUID!): GraphQLCombat
	"""
	One attack, as the caller may see it: the attacker and target read
	"Unknown" to a player who cannot see them (FR-002a).
	"""
	attack(id: UUID!): Attack
	"""
	A scene's attacks, newest first, fifty at a time. `before` is the last
	attack of the previous page.
	"""
	sceneAttacks(sceneId: UUID!, before: UUID): [Attack!]!
	"""
	The caller's pending offers, for a reconnect (FR-008). A Game Master
	receives every pending offer in the world.
	"""
	pendingOffers(worldId: UUID!): [Offer!]!
	"""
	What `makeAttack` would record, and whether the turn would refuse it.
	A warning before rolling (FR-033): it refuses nothing and writes
	nothing.
	"""
	previewAttack(input: AttackInput!): AttackPreview!
	worldSyncPlan(worldId: UUID!, held: [HeldItemInput!]!): SyncPlan!
	"""
	Every event in this world newer than `after_id`.
	
	Authorized by world membership on every call, like every other
	world-scoped resolver: a disconnection is not a reason to trust a
	client's claim about what it used to be allowed to see, and a member
	removed during the outage must not be handed the events they missed
	while being removed.
	"""
	worldEventsSince(worldId: UUID!, afterId: Int!): WorldEventCatchUp!
	"""
	Who else is reachable in this world right now.
	
	Advisory and instantly stale by nature — a session may end between
	this answer and the first signal sent to it, which is why a signal to
	a departed session is a no-op rather than an error.
	"""
	peerSessions(worldId: UUID!): [String!]!
	"""
	This account's shelf, newest first (050 FR-002).
	
	There is no argument that could widen it to another account, and the
	store offers no listing that spans owners, so "whose library?" is
	answered by who is calling and by nothing else.
	"""
	myLibrary: [Compendium!]!
	"""
	One book, if it is the caller's — and `null` if it is not, whether
	because there is no such compendium or because it is somebody else's.
	"""
	compendium(id: UUID!): Compendium
	"""
	What came out of one book, a page at a time, optionally of one kind
	(FR-042).
	
	`after` is the `nextCursor` of the previous page and nothing else; a
	cursor naming an entry that is no longer there — a re-import replaced
	the base underneath a browsing session — is refused rather than
	silently answered from the beginning, because a page of somebody's
	place in a book quietly becoming page one reads as lost data.
	"""
	compendiumEntries(compendiumId: UUID!, kind: String, after: String, first: Int): CompendiumEntryPage!
	"""
	Does this account already hold the book in this file? (FR-047.)
	
	Asked **before** the upload, with a hash and nothing else: a hash is
	not content, and catching a book the account already has is worth far
	more before some megabytes of entries are sent than after.
	
	Scoped to the caller's own library, never across accounts — importing
	a book a second time for a second world is the duplication this arc
	exists to prevent, and matching across accounts would be a different
	product with a different consent story.
	"""
	compendiumForFileHash(sourceHash: String!): Compendium
	"""
	Which books this table is running (FR-030, FR-035).
	
	Readable by every member, and it carries no content — see
	[`GraphQLWorldBook`].
	"""
	worldBookList(worldId: UUID!): [WorldBook!]!
	"""
	What the owner of this world could switch on and has not (FR-030,
	FR-041): the owner's shelf, narrowed to this world's system.
	
	Answers to the Owner, Game Masters and Trusted Players, and it is the
	**owner's** shelf for all of them (FR-010a). A Player asking gets the
	refusal, not an empty list — an empty list would read as "the owner
	has no books" when it means "this is not yours to ask".
	"""
	compendiumsOfferedToWorld(worldId: UUID!): [OfferedBook!]!
	"""
	Browse one switched-on book from inside the world (049 FR-042), as
	this world reads it (050 FR-022).
	
	This is the fetch: the entries come from the account's shelf every
	time they are asked for, with this world's changes laid over them, and
	no copy of either exists in this world to read instead. `showHidden`
	includes what this world hides, marked, so it can be put back.
	"""
	worldCompendiumEntries(worldId: UUID!, compendiumId: UUID!, kind: String, after: String, first: Int, showHidden: Boolean): WorldEntryPage!
	"""
	What this world added beside books it has since switched off (spec
	050 decision 5). Kept, authored, and readable here until somebody
	removes it with `restoreWorldEntry`.
	"""
	worldAdditionsWithoutBook(worldId: UUID!): [WorldEntry!]!
	"""
	Worlds whose name contains `search`, or whose id it is, for an
	operator deciding what to pause.
	"""
	playPauseCandidates(search: String!, first: Int = 20): [PauseCandidateWorld!]!
	"""
	The pause record, newest first. `active` narrows it to pauses in force
	(`true`) or lifted (`false`); `worldId` to one world.
	"""
	playPauses(active: Boolean, worldId: UUID, first: Int, after: String): PlayPauseConnection!
	"""
	Requests to pause a world, newest first: the pending ones an operator
	has to decide, unless `state` asks for decided ones.
	"""
	playPauseRequests(state: PauseRequestState = PENDING, first: Int, after: String): PauseRequestConnection!
	"""
	Whether this world's play is paused, since when, and when it was
	before (FR-024, FR-050).
	
	Guarded by membership and **not** by the pause gate, because the
	notice a paused table is sent to is what asks it. A site admin who is
	not a member is refused like anyone else who is not.
	"""
	worldPlayState(worldId: UUID!): WorldPlayState!
	genieSession(worldId: UUID!): GraphQLGenieSession
	genieResourceHoldings(sessionId: UUID!, actorId: UUID): [GraphQLGenieResourceHolding!]!
	genieTradeProposals(actorId: UUID!): [GraphQLGenieTradeProposal!]!
	genieShopListings(actorId: UUID!): [GraphQLGenieShopListing!]!
	geniePuzzleClockRewards(clockId: UUID!): [GraphQLGeniePuzzleClockReward!]!
}

input AttachAbilityToActorInput {
	actorId: UUID!
	abilityId: UUID!
}

input AttachAbilityToItemInput {
	itemId: UUID!
	abilityId: UUID!
}

type Attack {
	id: UUID!
	sceneId: UUID!
	attacker: AttackParty!
	"""
	Null when the attack was made at nothing.
	"""
	target: AttackParty
	"""
	Null when the attacker is redacted.
	"""
	abilityName: String
	toHit: GraphQLRollResolution!
	"""
	A hit's damage.
	"""
	damage: GraphQLRollResolution
	"""
	Null when the target has none, or is redacted.
	"""
	defence: Int
	outcome: AttackOutcome!
	"""
	System units, footprint to footprint (Phase 7).
	"""
	distance: Float
	flags: [AttackFlag!]!
	actionCost: ActionCost!
	"""
	Null on a miss, with no target, or when the system has no hit points.
	"""
	offer: Offer
	multiattackOf: UUID
	createdAt: NaiveDateTime!
}

"""
Setting what an ability or item is as an attack. Every field is written:
a null reach clears it.
"""
input AttackFieldsInput {
	reach: Float
	rangeNormal: Float
	rangeLong: Float
	needsLineOfSight: Boolean!
	actionCost: ActionCost!
	legendaryCost: Int!
	multiattack: [UUID!]!
}

"""
What an attack is recorded as having done that the table should know
(C3: never a refusal). Phase 7 sets reach, range and sight; Phases 8 and 9
the budget flags.
"""
enum AttackFlag {
	OUT_OF_REACH
	LONG_RANGE
	BEYOND_RANGE
	NO_LINE_OF_SIGHT
	NO_REACH_DECLARED
	OVERSPENT
	LEGENDARY_ON_OWN_TURN
}

input AttackInput {
	attackerTokenId: UUID!
	"""
	Exactly one of `abilityId` and `itemId`.
	"""
	abilityId: UUID
	itemId: UUID
	"""
	Null: a roll into the air, which offers and applies nothing.
	"""
	targetTokenId: UUID
	"""
	Per part of a multiattack; overrides `targetTokenId` for that part.
	"""
	targets: [UUID!]
	"""
	Defaults to the ability's. `REACTION` is not held to the turn.
	"""
	actionCost: ActionCost
	bindings: [PlaceholderBindingInput!]
}

enum AttackOutcome {
	HIT
	MISS
	NO_DEFENCE
	NO_TARGET
}

"""
One side of an attack. `tokenId` null and `label` "Unknown" when this
viewer may not know it (contract §3).
"""
type AttackParty {
	tokenId: UUID
	label: String!
}

type AttackPreview {
	distance: Float
	flags: [AttackFlag!]!
	turn: TurnCheck!
	"""
	The attack's reach, in `unit`; null when it declares none.
	"""
	reach: Float
	rangeNormal: Float
	rangeLong: Float
	"""
	What the system's distances are in ("ft"). Empty when nothing was
	measured.
	"""
	unit: String!
}

"""
What somebody agreed to, when, and in order to publish what.

`terms` is filled from `terms_versions` by [`with_archived_terms`] and from
nowhere else. There is deliberately no constructor that takes a
[`crate::legal::VersionedDocument`]: the compiled-in document is the words
as they are *now*, and an old agreement answered with those is the failure
FR-008 exists to prevent.
"""
type Attestation {
	id: UUID!
	"""
	`"share"` or `"operator"`.
	"""
	purpose: String!
	"""
	Null once the account has been deleted (FR-010, FR-037).
	"""
	subjectUsername: String
	subjectUserId: UUID!
	attestedAt: String!
	termsVersionId: String!
	"""
	The words as they were. Resolved from the archive, never from the
	constant.
	"""
	terms: VersionedLegalDocument!
	publishableKind: String
	publishableId: UUID
	worldId: UUID
}

"""
The whole of what a publishing mutation accepts, and its smallness is the
point.
"""
input AttestationInput {
	"""
	The `versionId` from `sharingTerms`, echoed back unmodified.
	"""
	termsVersionId: String!
}

"""
What an ability of a type may be attached to.

**Exactly one**, never a set. A type binds to characters or to items or to
nothing, so FR-019's refusal is a comparison rather than a set membership
test, and a Spell stays a thing characters have while an Enchantment stays
a thing items carry.
"""
enum Binds {
	CHARACTER
	ITEM
	NOTHING
}

"""
What switching a book off takes out of this world, said before it happens
(FR-013, FR-032).
"""
type BookSwitchOffReport {
	compendiumId: UUID!
	bookTitle: String!
	"""
	How many entries stop being served the moment this is confirmed.
	"""
	entryCount: Int!
	"""
	A few of them by name, so this reads as a warning about *things* and
	not about a number.
	"""
	entryNames: [String!]!
	"""
	Changes and hides this world made over the book, each named, because
	they go with it (050 FR-013, 049 FR-046).
	"""
	deltas: [String!]!
	"""
	What this world added beside the book, each named, because it
	**stays** (spec 050 decision 5): the world's own writing never needed
	the book.
	"""
	additionsKept: [String!]!
	"""
	Whether this call switched anything off. False for the report, true
	for the confirmation, so a caller can never mistake one for the other.
	"""
	switchedOff: Boolean!
}

input BringPartyToSceneInput {
	"""
	Where the party is arriving.
	"""
	sceneId: UUID!
	"""
	The characters to bring, in the order they should be laid out.
	
	Omitted or empty means the whole party — every non-NPC character in
	the world, which is the same definition `whole_party` rewards use in
	`mutations_genie_session.rs`. A Game Master who says "bring the party"
	without listing anybody should not have to enumerate a table they
	already own.
	"""
	actorIds: [UUID!]
}

type CollectionTypeCount {
	memberType: String!
	count: Int!
}

"""
One book on an account's shelf (049 FR-041, 050 FR-002).
"""
type Compendium {
	id: UUID!
	bookTitle: String!
	"""
	The file's SHA-256. Readable only by the account that holds it, and
	what lets a client recognise a file it already has before reading a
	second copy of it (FR-047). A hash is not content.
	"""
	sourceHash: String!
	systemId: String!
	origin: ContentOrigin!
	parserVersion: String!
	pageCount: Int!
	"""
	Pages that yielded no text (FR-005). A book that was a third scans
	says so on the shelf, months later.
	"""
	silentPageCount: Int!
	entryCounts: [CompendiumKindCount!]!
	"""
	Everything the counts add up to, so a shelf need not sum them itself.
	"""
	entryTotal: Int!
	importedAt: String!
	updatedAt: String!
}

"""
One entry, with the book it came from and the page it was found on
(FR-043).

`compendiumId` and `bookTitle` both travel with every entry deliberately:
FR-043 is a promise to the person reading an entry, and an entry that can
only say which book it came from by being looked up somewhere else is an
entry that will be shown without saying it.
"""
type CompendiumEntry {
	id: UUID!
	compendiumId: UUID!
	bookTitle: String!
	kind: String!
	name: String!
	"""
	The reader was unsure it had the name right. Shown, not hidden.
	"""
	nameUncertain: Boolean!
	page: Int!
	"""
	Each declared field with the certainty it was read at. A field looked
	for and not found carries no value at all, which is why this crosses
	as it was stored rather than being flattened into strings.
	"""
	fieldValues: JSON!
	proseText: String
	"""
	The reader distrusted this one (FR-023's third state, kept after the
	review so a suspect entry stays visibly suspect on the shelf).
	"""
	suspect: Boolean!
}

"""
One page of entries, and where the next one starts.
"""
type CompendiumEntryPage {
	entries: [CompendiumEntry!]!
	"""
	`null` when this page is the last one. A client that keeps asking
	until this is null cannot loop, because the cursor is the id of the
	last entry handed out and the order it indexes is total.
	"""
	nextCursor: String
	"""
	How many entries match the filter in total, so a shelf can say "20 of
	1,431" without fetching 1,431 of them.
	"""
	total: Int!
}

"""
How many of one kind a book produced.

A list of pairs rather than the stored JSON object, so the shelf renders
counts without a client parsing an untyped blob and inventing its own
ordering. The stored object is bookkeeping; the entries remain the truth.
"""
type CompendiumKindCount {
	kind: String!
	count: Int!
}

input CompleteConnectionInput {
	worldId: UUID!
	"""
	Whatever the host handed back when the user finished granting access,
	verbatim and uninterpreted.
	
	A string rather than a structured type on purpose: this module does not
	know what is inside it and must not learn. The adapter validates it,
	and refuses a grant covering more than the single repository being
	connected (FR-036a) — narrowing a too-broad grant after the fact is not
	an option, because a grant we hold and promise not to use is still a
	grant we hold.
	"""
	grantResponse: String!
	"""
	Which repository this world binds to, as `owner/name` (FR-036f).
	
	Required in practice, and `Option` only so that a client which omits it
	gets told *which repositories it may choose from* rather than a schema
	error naming a field. An installation routinely covers several — the
	grant is broad, the binding is not — and picking for the user is how a
	world ends up mirroring into a repository nobody chose. That is not
	hypothetical: the first live run of this flow connected a world to this
	project's own public source repository, because it took whichever the
	host listed first.
	"""
	repositoryRef: String
	"""
	Defaults to `main`.
	"""
	branch: String
	"""
	Defaults to `lore`. Repository-relative, no leading slash.
	"""
	directory: String
}

"""
