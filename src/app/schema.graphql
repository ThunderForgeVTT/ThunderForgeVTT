	Full revision history for a lore entry, newest first (FR-017).
	"""
	loreEntryRevisions(loreEntryId: UUID!): [GraphQLLoreRevision!]!
	"""
	FR-003: only the DM may view or change the ownership block. Returns only explicit rows — members with no row default to Viewer, which the client renders itself by combining this with the full world-member roster (contracts/lore-permissions.md).
	"""
	loreEntryPermissions(loreEntryId: UUID!): [GraphQLLorePermission!]!
	"""
	The world's connection, or null when it has none.
	
	Any world member, not just the owner. The fields here describe *state*,
