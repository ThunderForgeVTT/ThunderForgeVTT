	"""
	publishedOperatorValues: PublishedOperatorValues!
	actorAbilities(actorId: UUID!): [GraphQLActorAbilityEntry!]!
	worldItems(worldId: UUID!, search: String): [GraphQLItem!]!
	item(itemId: UUID!): GraphQLItem!
	suggestItemName(worldId: UUID!, name: String!): [GraphQLItem!]!
	"""
	FR-003: only the DM may view or change the ownership block. Returns only explicit rows — members with no row default to Viewer.
	"""
	itemPermissions(itemId: UUID!): [GraphQLItemPermission!]!
	"""
	ADR-071: the active share link for a item the caller owns, or null.
