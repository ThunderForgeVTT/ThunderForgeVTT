	worldContentInventory(worldId: UUID!, targetSystemId: String): GraphQLContentInventory!
	"""
	The abilities this item carries.
	"""
	itemAbilities(itemId: UUID!): [GraphQLItemAbilityEntry!]!
	"""
	FR-026: the ownership block is DM-only to read *and* write. This governs EDIT RIGHTS ONLY — visibility is `world_abilities.gm_only`, changed through its own DM-gated mutation, because the ladder's lowest level (`Viewer`) is also its default and so cannot express "hidden".
	"""
	abilityPermissions(abilityId: UUID!): [GraphQLAbilityPermission!]!
	"""
	ADR-071: the active share link for a ability the caller owns, or null.
