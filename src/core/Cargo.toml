[package]
name = "thunderforge_core"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license = "BSD 3-Clause License"

[lib]
crate-type = ["rlib", "cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.64"
base64 = "0.21"
reqwest-wasm = { version = "*", features = ["json"] }
wasm-bindgen = { version = "0.2.74", optional = true }
wasm-bindgen-futures = { version = "0.4.24", optional = true }
regex = "1.5.4"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "0.8", features = ["serde", "v4", "wasm-bindgen"] }
js-sys = "0.3.51"
web-sys = { version = "0.3.82", features = ["console"], optional = true }

[features]
client = ["wasm-bindgen-futures", "wasm-bindgen", "web-sys"]
