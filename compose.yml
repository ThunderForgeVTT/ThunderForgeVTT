# ThunderForge, the whole app, built from source and standing on its own.
#
#   docker compose up -d --build
#   docker compose logs app | grep /setup/
#
# That is the install. The instance comes up *unconfigured*, which is the
# point: the first-run wizard is what greets you at http://localhost:42080, and
# the setup link it needs is printed in the app log.
#
# # Ports
#
# Only the app is published: 42080, on a block that collides with nothing a
# developer already runs. `THUNDERFORGE_PORT` moves it, and
# `THUNDERFORGE_PUBLIC_URL` has to move with it, because that is the host the
# setup link names.
#
# Postgres, RustFS and Mailpit are reachable by service name inside this
# project's network and from nowhere else. To reach them from the host (a
# `pg_dump`, a look at the Mailpit inbox), add the override, which publishes
# them on 127.0.0.1 at the port numbers this file used to publish:
#
#   docker compose -f compose.yml -f compose.ports.yml up -d
#
# No service has a fixed container name, so a second project (`-p other`) can
# run beside this one. Reach a service through compose, not by name:
#
#   docker compose exec postgres psql -U postgres thunderforge
#
# # What is a secret here, and what is not
#
# The database password, the object-store root credentials and the cookie key
# below are the values a local instance runs with out of the box. They sit in
# a file in the repository, which means they are not secrets at all. A real
# deployment sets its own through the environment or an `.env` beside this
# file — every `${VAR:-default}` below reads it — and nothing else here needs
# to change.
#
# # Mail
#
# Nothing here configures mail on purpose: a variable set in the environment
# wins over a stored answer, so setting SMTP here would take the question away
# from the wizard. Mailpit is in the stack for a local try — answer the mail
# step with host `mailpit`, port `1025`, no security — and read what arrives at
# http://localhost:42825 once `compose.ports.yml` is added. A real table points
# the same step at a real relay.
name: thunderforge-app

services:
  # The one address to remember: the server, which serves the client too.
  # It is the only service published on the host.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: thunderforge-app:local
    restart: unless-stopped
    ports:
      - "${THUNDERFORGE_PORT:-42080}:30000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/thunderforge
      THUNDERFORGE_DATA_PATH: /srv/thunderforge/data
      # What the setup link names. Without it the server prints a link to a
      # host that only exists in a developer's browser, which is wrong for
      # every containerised operator — and is exactly what the first-run e2e
      # spec pins.
      THUNDERFORGE_PUBLIC_URL: ${THUNDERFORGE_PUBLIC_URL:-http://localhost:42080}
      # The cookie key, which the server base64-decodes at boot and will
      # panic on if it is not valid base64 — so this is base64, not a
      # passphrase. Make your own with:
      #   openssl rand -base64 64 | tr -d '\n'
      THUNDERFORGE_SECRET: ${THUNDERFORGE_SECRET:-dGh1bmRlcmZvcmdlIGxvY2FsIGV4cGxvcmF0aW9uIGluc3RhbmNlIG9ubHksIG5vdCBhIGRlcGxveW1lbnQgc2VjcmV0IDAxMjM0NTY3ODk=}
      # Plain http on localhost cannot carry a Secure cookie. Set it to true
      # once the instance sits behind TLS.
      THUNDERFORGE_SECURE_COOKIES: ${THUNDERFORGE_SECURE_COOKIES:-false}
      # The way back in for a sole administrator who has lost both their
      # authenticator and their recovery codes: set it to their username for
      # one start, then unset it. Empty, which is the default, does nothing.
      # See docs/SECOND_FACTOR.md.
      THUNDERFORGE_RESET_ADMIN_SECOND_FACTOR: ${THUNDERFORGE_RESET_ADMIN_SECOND_FACTOR:-}
      # Reissue the first-run setup link into the log when the first one was
      # lost before setup finished. Set it for one start, then unset it.
      THUNDERFORGE_REGENERATE_SETUP_CODE: ${THUNDERFORGE_REGENERATE_SETUP_CODE:-}
      # Where uploads go. These are also declared settings since spec 064, and
      # the environment wins over a stored answer — which is why the wizard
      # will show them as fixed by this deployment rather than asking.
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: thunderforge-canvas-assets
      RUSTFS_ROOT_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:-thunderforge-rustfs-root}
      RUSTFS_ROOT_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:-thunderforge-rustfs-root-secret}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # The writable half of the data directory. Mounted per subdirectory so
      # the image's `packs` stay visible beside them.
      - app_assets:/srv/thunderforge/data/assets
      - app_worlds:/srv/thunderforge/data/worlds
      - app_databases:/srv/thunderforge/data/databases
      - app_config:/srv/thunderforge/data/config
      - app_modules:/srv/thunderforge/data/modules
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:30000/api/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: thunderforge
    volumes:
      - app_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thunderforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:-thunderforge-rustfs-root}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:-thunderforge-rustfs-root-secret}
    volumes:
      - app_rustfs:/data

  # Catches every message the instance sends and delivers none of them. See
  # the note on mail at the top of this file.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  app_db:
  app_rustfs:
  app_assets:
  app_worlds:
  app_databases:
  app_config:
  app_modules:
