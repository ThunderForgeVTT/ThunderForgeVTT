# Who may do what to a world, and who may see which scenes.
#
# Extracted from the server because these are decisions, not queries: a role,
# an ownership fact and a scene flag go in, and an allow/deny comes out. They
# had been welded to diesel and a live Postgres, so the only way to ask "may a
# Player delete a world" was to stand up a database and try it — and three
# holes survived exactly that gap, including `deleteWorld` being reachable by
# any world member at all.
#
# No diesel, no schema, no pool. Every rule in here is a pure function over
# plain values, so the whole permission matrix is enumerable in a unit test.
[dependencies]
