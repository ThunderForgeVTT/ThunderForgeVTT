[lints]
workspace = true

[package]
name = "thunderforge_opfs"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

[lib]
crate-type = ["rlib"]

# The OPFS blob store, extracted from `thunderforge-cache-browser`.
#
# As in that crate, the wasm toolchain is deliberately confined to
# `[target.'cfg(target_arch = "wasm32")'.dependencies]` so the pure/impure
# split is build-enforced rather than conventional: path derivation and
# naming policy (`paths.rs`) cannot reach for `web-sys` even by accident,
# because on a native `cargo test` those crates are not in the dependency
# graph at all — and that is exactly the part worth unit-testing without a
# browser.
[dependencies]
uuid = { version = "1.26.0", features = ["serde"] }
thunderforge_cache_core = { path = "../thunderforge-cache-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.104"
web-sys = { version = "0.3.104", features = [
  # OPFS (R2): navigator.storage.getDirectory() and the handle tree below it.
  "Navigator",
  "StorageManager",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemRemoveOptions",
  "FileSystemWritableFileStream",
  "WritableStream",
  "Blob",
  "File",
  # WebCrypto (R4): non-extractable AES-GCM session key.
  "Crypto",
  "SubtleCrypto",
  "CryptoKey",
  "AesKeyGenParams",
  "AesGcmParams",
  # IndexedDB (R2): the `index`, `keys`, `outbox` and `meta` stores.
  "IdbFactory",
  "IdbDatabase",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbObjectStoreParameters",
  "IdbVersionChangeEvent",
  "DomStringList",
  "DomException",
  "Event",
  "EventTarget",
] }

[dev-dependencies]
