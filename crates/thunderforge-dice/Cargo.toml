[lints]
workspace = true

[package]
name = "thunderforge_dice"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license = "BSD 3-Clause License"

[lib]
crate-type = ["rlib"]

# Deliberately no `bevy`/`wasm-bindgen`/`rand` dependency (Constitution
# Principle II: modular, independently testable; spec 014 research.md §3:
# the evaluator never owns entropy — `rand_core` is the trait-only half
# of the `rand` ecosystem, so this crate accepts any injected `RngCore`
# without depending on a concrete RNG or OS/entropy facility itself).
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand_core = "0.10"

[dev-dependencies]
