[lints]
workspace = true

[package]
name = "thunderforge_cache_browser"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

[lib]
crate-type = ["rlib"]

# The browser half of spec 028 (plan.md "Project Structure", ADR-052). Every
# rule this crate needs already lives in `thunderforge-cache-core`; what is
# here is the I/O that only a browser can perform — OPFS blobs, WebCrypto
# keys, IndexedDB records.
#
# The wasm toolchain is deliberately confined to
# `[target.'cfg(target_arch = "wasm32")'.dependencies]`. That is not a
# convenience: it makes the pure/impure split a *build-enforced* boundary
# rather than a convention. Path derivation, envelope framing and index-entry
# manipulation cannot reach for `web-sys` even by accident, because on a
# native `cargo test` those crates are not in the dependency graph at all —
# and those are exactly the parts worth unit-testing without a browser.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["serde"] }
thunderforge_cache_core = { path = "../thunderforge-cache-core" }
thunderforge_opfs = { path = "../thunderforge-opfs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.104"
web-sys = { version = "0.3.104", features = [
  # OPFS (R2): navigator.storage.getDirectory() and the handle tree below it.
  "Navigator",
  "StorageManager",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemRemoveOptions",
  "FileSystemWritableFileStream",
  "WritableStream",
  "Blob",
  "File",
  # WebCrypto (R4): non-extractable AES-GCM session key.
  "Crypto",
  "SubtleCrypto",
  "CryptoKey",
  "AesKeyGenParams",
  "AesGcmParams",
  # IndexedDB (R2): the `index`, `keys`, `outbox` and `meta` stores.
  "IdbFactory",
  "IdbDatabase",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbObjectStoreParameters",
  "IdbVersionChangeEvent",
  "DomStringList",
  "DomException",
  "Event",
  "EventTarget",
  # WebRTC (T088). Peer-assisted distribution moves content-addressed bytes
  # over a data channel; the SDP and ICE payloads themselves are opaque
  # strings relayed by the server, so nothing here needs a media API. No
  # STUN/TURN feature is listed because none is configured — see `peer.rs`.
  "RtcPeerConnection",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcDataChannelEvent",
  "RtcSessionDescriptionInit",
  "RtcSdpType",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcPeerConnectionIceEvent",
  "MessageEvent",
] }

[dev-dependencies]

# Executing the wasm-only half, rather than merely compiling it.
#
# Everything pure in this crate is unit-tested natively, which leaves the
# browser glue — the part that has historically shipped compiled and never
# run. `wasm-bindgen-test` closes that gap where the API in question can be
# stood up outside a browser: `tests/locks.rs` drives the real
# `acquire_exclusive` against a hand-built `navigator.locks` under `wasm-pack
# test --node`. OPFS, IndexedDB and WebCrypto cannot be faked so cheaply and
# stay covered by the e2e suite.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
