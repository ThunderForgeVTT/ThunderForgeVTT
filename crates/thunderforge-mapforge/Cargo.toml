[lints]
workspace = true

[package]
name = "thunderforge_mapforge"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

# A library only, mirroring `thunderforge-crucible`'s split: all routing
# lives here so tests can drive the router in-process, and the binary that
# reads a port and serves is `apps/mapforge-server`.
[lib]
crate-type = ["rlib"]

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Lossy WebP. `image`'s own WebP encoder is lossless-only, which measured 2-3x
# *larger* than the source for photographic map art — see `server::encode_webp`.
webp = "0.3.1"
thiserror = "2.0.20"
