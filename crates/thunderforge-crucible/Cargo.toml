[lints]
workspace = true

[package]
name = "thunderforge_crucible"
version = "0.1.0"
edition = "2024"
repository = "git@github.com:ThunderForgeVTT/ThunderForgeVTT.git"
license.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "crucible-server"
path = "src/bin/crucible-server.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["serde", "v7"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }
async-trait = "0.1.92"
thiserror = "2.0.20"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
